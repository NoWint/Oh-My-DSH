name: Hourly Discovery Scan

on:
  schedule:
    # Run every hour at minute 7
    - cron: '7 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    name: DSH Ecosystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python / 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies / 安装依赖
        run: pip install -e ".[dev]" 2>/dev/null || true

      - name: Create .env from secrets / 从 Secret 创建环境变量
        run: |
          cat > .env <<EOF
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 600 .env

      - name: Run discovery scan / 运行扫描
        id: scan
        run: |
          python3 scripts/dsh_discovery.py --repo "$(pwd)"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check for changes / 检查变更
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updates / 提交并推送更新
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "oh-my-dsh-bot"
          git config user.email "bot@oh-my-dsh.dev"
          git add README.md var/
          git commit -m "chore: hourly scan — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Create Release on significant update / 重大更新时创建 Release
        if: steps.changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(date -u +'%Y%m%d-%H%M')
          name: "Scan ${{ github.event.schedule || 'manual' }} — $(date -u +'%B %d, %Y')"
          body: |
            ## Scan Summary / 扫描摘要

            - **Time:** ${{ github.event.schedule || 'manual trigger' }}
            - **Date:** ${{ steps.scan.outputs.* }}
            - **Changes:** README and state updated

            ### Recent additions / 近期新增
            See the latest [TASK3_REPORT.md](./TASK3_REPORT.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests / 运行测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: python3 -m pytest tests/ -v --tb=short 2>/dev/null || python3 -m unittest discover -s tests -v
